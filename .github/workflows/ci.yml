name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: Check JavaScript and world checkpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: node --check all project JS (lib/ excluded)
        run: |
          set -e
          found=0
          for f in $(find js -name '*.js' -type f); do
            echo "checking $f"
            node --check "$f"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "no JS files found under js/"
            exit 1
          fi

      - name: Test world checkpoint recovery
        run: node --test tests/checkpoint.test.js
